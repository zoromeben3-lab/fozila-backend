<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fôliza — Mon espace</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="fozila.css"/>
  <style>
    .dash-tabs{display:flex;gap:4px;background:var(--card2);border-radius:10px;padding:4px;margin-bottom:28px;width:fit-content;}
    .dash-tab{padding:8px 18px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);transition:all 0.2s;border:none;background:none;font-family:inherit;}
    .dash-tab.active{background:var(--v);color:#fff;}
    .dash-panel{display:none;}
    .dash-panel.active{display:block;}
    .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:32px;}
    .stat-box{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center;}
    .stat-box .n{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;color:var(--v-light);}
    .stat-box .l{font-size:12px;color:var(--muted);margin-top:4px;}
    .lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
    .lib-card{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;transition:all 0.2s;cursor:pointer;}
    .lib-card:hover{border-color:var(--green);transform:translateY(-2px);}
    .lib-card .cov{font-size:32px;margin-bottom:8px;}
    .lib-card .ttl{font-size:12px;font-weight:600;margin-bottom:4px;}
    .lib-card .prc{font-size:11px;color:var(--muted);margin-bottom:10px;}
    .mini-player{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-top:6px;}
    .mini-player audio{width:100%;height:28px;outline:none;}
    .mini-player audio::-webkit-media-controls-panel{background:#1a1a1a;}
    .tracks-list{margin-top:8px;display:none;}
    .track-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);cursor:pointer;}
    .track-item:last-child{border-bottom:none;}
    .track-item:hover .track-title{color:var(--v-light);}
    .track-num{font-size:10px;color:var(--muted);width:16px;flex-shrink:0;}
    .track-title{font-size:11px;flex:1;}
    .track-play{font-size:14px;}
    @media(max-width:640px){.stat-row{grid-template-columns:repeat(2,1fr);}}
  </style>
</head>
<body>
  <div id="announce-bar"></div>
  <nav id="main-nav"></nav>

  <div class="section-wrap">
    <!-- EN-TÊTE PROFIL -->
    <div style="display:flex;align-items:center;gap:20px;margin-bottom:32px;" id="profile-header"></div>

    <!-- STATS -->
    <div class="stat-row" id="user-stats"></div>

    <!-- ONGLETS -->
    <div class="dash-tabs">
      <button class="dash-tab active" onclick="switchTab('library')">Ma bibliothèque</button>
      <button class="dash-tab" onclick="switchTab('pending')">En attente</button>
      <button class="dash-tab" onclick="switchTab('tickets')">🎟️ Mes tickets</button>
      <button class="dash-tab" onclick="switchTab('history')">Historique</button>
      <button class="dash-tab" onclick="switchTab('settings')">Paramètres</button>
    </div>

    <!-- MA BIBLIOTHÈQUE -->
    <div class="dash-panel active" id="panel-library">
      <div class="card">
        <h3 style="font-family:'Syne',sans-serif;font-size:18px;font-weight:700;margin-bottom:20px;">Albums achetés</h3>
        <div class="lib-grid" id="lib-albums"></div>
      </div>
    </div>

    <!-- EN ATTENTE -->
    <div class="dash-panel" id="panel-pending">
      <div class="card">
        <h3 style="font-family:'Syne',sans-serif;font-size:18px;font-weight:700;margin-bottom:8px;">Demandes en attente de validation</h3>
        <p style="color:var(--muted);font-size:13px;margin-bottom:20px;">Ces achats seront débloqués dès que l'administrateur aura confirmé la réception du paiement.</p>
        <div id="pending-list"></div>
      </div>
    </div>

    <!-- TICKETS -->
    <div class="dash-panel" id="panel-tickets">
      <div class="card">
        <h3 style="font-family:'Syne',sans-serif;font-size:18px;font-weight:700;margin-bottom:8px;">🎟️ Mes tickets</h3>
        <p style="color:var(--muted);font-size:13px;margin-bottom:20px;">Chaque achat validé vous donne un ticket pour le tirage cadeau !</p>
        <div id="tickets-list"></div>
      </div>
    </div>

    <!-- HISTORIQUE -->
    <div class="dash-panel" id="panel-history">
      <div class="card">
        <h3 style="font-family:'Syne',sans-serif;font-size:18px;font-weight:700;margin-bottom:20px;">Historique des achats</h3>
        <div id="history-list"></div>
      </div>
    </div>

    <!-- PARAMÈTRES -->
    <div class="dash-panel" id="panel-settings">
      <div class="card">
        <h3 style="font-family:'Syne',sans-serif;font-size:18px;font-weight:700;margin-bottom:20px;">Informations personnelles</h3>
        <div class="form-group"><label>Nom</label><input type="text" id="set-name"/></div>
        <div class="form-group"><label>Email</label><input type="email" id="set-email" style="opacity:0.6;" readonly/></div>
        <div class="form-group"><label>Nouveau mot de passe</label><input type="password" id="set-pwd" placeholder="Laisser vide pour ne pas changer"/></div>
        <div style="display:flex;gap:10px;margin-top:8px;">
          <button class="btn-primary" onclick="saveSettings()">Sauvegarder</button>
          <button class="btn-ghost" style="color:var(--red);border-color:rgba(239,68,68,0.3);" onclick="FOZILA.logout()">Se déconnecter</button>
        </div>
      </div>
    </div>
  </div>

  <script src="fozila.js"></script>
  <script>
    const user = FOZILA.getUser();
    if (!user || !FOZILA.getToken()) { location.href = 'auth.html'; }

    FOZILA.injectNav('dashboard');
    FOZILA.injectAnnounce();

    function switchTab(id) {
      const tabs = ['library','pending','tickets','history','settings'];
      document.querySelectorAll('.dash-tab').forEach((t,i) => {
        t.classList.toggle('active', tabs[i] === id);
      });
      document.querySelectorAll('.dash-panel').forEach(p => p.classList.remove('active'));
      document.getElementById('panel-' + id).classList.add('active');
    }

    async function loadDashboard() {
      let purchases = [];
      let isOffline = false;

      try {
        purchases = await FOZILA.getMyPurchases();
        // Sauvegarder en cache local pour le mode hors ligne
        localStorage.setItem('fozila_purchases_cache', JSON.stringify(purchases));
      } catch(e) {
        // Hors ligne — charger depuis le cache local
        isOffline = true;
        const cached = localStorage.getItem('fozila_purchases_cache');
        purchases = cached ? JSON.parse(cached) : [];
        if (isOffline) {
          FOZILA.toast('Mode hors ligne — bibliothèque depuis le cache', 'info');
        }
      }
      const albumPurchases  = purchases.filter(p => p.item_type === 'album');
      const singlePurchases = purchases.filter(p => p.item_type === 'single');
      const totalSpent = purchases.reduce((s, p) => s + p.amount, 0);
      const totalTracks = albumPurchases.reduce((s, p) => s + (p.item?.tracks || 0), 0);

      // PROFIL
      document.getElementById('profile-header').innerHTML = `
        <div style="width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--v),#4c1d95);display:flex;align-items:center;justify-content:center;font-size:28px;border:3px solid var(--v-border);"></div>
        <div>
          <h1 style="font-family:'Syne',sans-serif;font-size:26px;font-weight:800;margin-bottom:3px;" id="dash-name">${user.name}</h1>
          <span style="background:var(--v-dim);border:1px solid var(--v-border);color:var(--v-light);padding:3px 12px;border-radius:100px;font-size:11px;font-weight:600;">Membre Fôliza</span>
          ${isOffline ? `<span style="background:rgba(240,165,0,0.15);border:1px solid rgba(240,165,0,0.3);color:#f0a500;padding:3px 12px;border-radius:100px;font-size:11px;font-weight:600;margin-left:6px;">📴 Hors ligne</span>` : ''}
        </div>
      `;

      // STATS
      document.getElementById('user-stats').innerHTML = `
        <div class="stat-box"><div class="n">${albumPurchases.length}</div><div class="l">Albums achetés</div></div>
        <div class="stat-box"><div class="n">${singlePurchases.length}</div><div class="l">Singles achetés</div></div>
        <div class="stat-box"><div class="n">${totalTracks}</div><div class="l">Titres disponibles</div></div>
        <div class="stat-box"><div class="n" style="font-size:16px;">${FOZILA.fmt(totalSpent)}</div><div class="l">Total dépensé</div></div>
      `;

      // BIBLIOTHÈQUE
      const libGrid = document.getElementById('lib-albums');
      if (!purchases.length) {
        libGrid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted);">
          
          <p style="margin-bottom:16px;">Votre bibliothèque est vide.</p>
          <a href="albums.html" class="btn-primary">Parcourir les albums</a>
        </div>`;
      } else {
        libGrid.innerHTML = purchases.map(p => {
          const itemId = p.item?.id || p.item_id;
          const token  = p.download_token;
          const type   = p.item_type;
          return `
          <div class="lib-card">
            <div class="cov" style="background:${p.item?.grad||'var(--card2)'};width:70px;height:70px;border-radius:10px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:28px;">
              ${p.item?.cover_path ? `<img src="${p.item.cover_path}" style="width:100%;height:100%;object-fit:cover;border-radius:10px;">` : (p.item?.emoji||'🎵')}
            </div>
            <div class="ttl">${p.item?.title || 'Article'}</div>
            <div class="prc">${type==='album'?'Album':'Single'} · ${FOZILA.fmt(p.amount)}</div>
            ${token && itemId ? `
              <button class="btn-primary" style="width:100%;padding:6px;font-size:11px;border-radius:6px;margin-top:4px;"
                onclick="location.href='player.html?token=${token}&type=${type}&id=${itemId}'">▶ Écouter</button>
            ` : `
              <button class="btn-ghost" style="width:100%;padding:6px;font-size:11px;border-radius:6px;margin-top:4px;" disabled>Non disponible</button>
            `}
          </div>`;
        }).join('');
      }

      // HISTORIQUE
      const histList = document.getElementById('history-list');
      if (!purchases.length) {
        histList.innerHTML = '<p style="color:var(--muted);font-size:14px;text-align:center;padding:30px;">Aucun achat enregistré.</p>';
      } else {
        histList.innerHTML = purchases.map(p => `
          <div class="history-row">
            <div class="history-icon" style="background:${p.item?.grad||'var(--card2)'};">${p.item?.emoji||'🎵'}</div>
            <div style="flex:1;">
              <div style="font-size:14px;font-weight:600;">${p.item?.title||'Article'}</div>
              <div style="font-size:12px;color:var(--muted);margin-top:2px;">${p.item_type==='album'?'Album':'Single'} · ${FOZILA.timeAgo(p.purchased_at)}</div>
            </div>
            <div style="text-align:right;">
              <div style="font-size:14px;font-weight:700;color:var(--v-light);">${FOZILA.fmt(p.amount)}</div>
              <span style="font-size:11px;color:var(--green);">✅ Validé</span>
            </div>
          </div>`).join('');
      }

      // PARAMÈTRES
      document.getElementById('set-name').value  = user.name;
      document.getElementById('set-email').value = user.email;

      // EN ATTENTE + VALIDÉS À TÉLÉCHARGER
      const pendingList = document.getElementById('pending-list');
      try {
        const pending  = await FOZILA.getMyPendingPurchases();
        // Achats validés mais pas encore mis en cache (download_token présent)
        const toCache  = purchases.filter(p => p.download_token && !localStorage.getItem('cached_' + p.download_token));

        let html = '';

        // Achats validés à télécharger
        if (toCache.length) {
          html += `<div style="background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.3);border-radius:10px;padding:14px;margin-bottom:16px;">
            <p style="color:var(--green);font-size:13px;font-weight:600;margin-bottom:12px;">✅ ${toCache.length} achat(s) validé(s) — téléchargez pour écouter hors ligne !</p>
            ${toCache.map(p => `
              <div class="history-row">
                <div class="history-icon" style="background:${p.item?.grad||'var(--card2)'};">${p.item?.emoji||'🎵'}</div>
                <div style="flex:1;">
                  <div style="font-size:14px;font-weight:600;">${p.item?.title||'Article'}</div>
                  <div style="font-size:12px;color:var(--muted);">${p.item_type==='album'?'Album':'Single'} · ${FOZILA.fmt(p.amount)}</div>
                </div>
                <button onclick="cacheAndRedirect('${p.download_token}','${p.item_type}','${p.item?.id||p.item_id}')" 
                  class="btn-green" style="padding:6px 14px;font-size:12px;border-radius:8px;">
                  📥 Télécharger
                </button>
              </div>`).join('')}
          </div>`;
        }

        // Commandes en attente de validation
        if (pending.length) {
          html += pending.map(p => `
            <div class="history-row">
              <div class="history-icon" style="background:${p.item?.grad||'var(--card2)'};">${p.item?.emoji||'🎵'}</div>
              <div style="flex:1;">
                <div style="font-size:14px;font-weight:600;">${p.item?.title||'Article'}</div>
                <div style="font-size:12px;color:var(--muted);margin-top:2px;">Dépôt : ${p.pay_ref} · ${FOZILA.timeAgo(p.purchased_at)}</div>
              </div>
              <span style="background:rgba(240,165,0,0.1);color:#f0a500;padding:4px 12px;border-radius:100px;font-size:11px;font-weight:600;">⏳ En attente</span>
            </div>`).join('');
        }

        if (!html) {
          html = '<p style="color:var(--muted);font-size:14px;text-align:center;padding:30px;">Aucune commande en attente.</p>';
        }

        pendingList.innerHTML = html;
      } catch(e) {
        pendingList.innerHTML = '<p style="color:var(--muted);font-size:14px;">Erreur de chargement.</p>';
      }

      // TICKETS
      const ticketsList = document.getElementById('tickets-list');
      try {
        const tickets = await FOZILA.getMyTickets();
        ticketsList.innerHTML = tickets.length ? `
          <div style="display:flex;flex-wrap:wrap;gap:10px;">
            ${tickets.map(t => `
              <div style="background:var(--v-dim);border:1px solid var(--v-border);border-radius:10px;padding:12px 18px;text-align:center;">
                <div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:var(--v-light);">${t.ticket_number}</div>
                <div style="font-size:10px;color:var(--muted);margin-top:2px;">${FOZILA.timeAgo(t.purchased_at)}</div>
              </div>`).join('')}
          </div>` : '<p style="color:var(--muted);font-size:14px;text-align:center;padding:30px;">Pas encore de ticket — achetez un album ou single pour en obtenir un !</p>';
      } catch(e) { ticketsList.innerHTML = '<p style="color:var(--muted);font-size:14px;">Erreur de chargement.</p>'; }
    }

    async function saveSettings() {
      const name = document.getElementById('set-name').value.trim();
      const pwd  = document.getElementById('set-pwd').value;
      if (!name) { FOZILA.toast('Le nom ne peut pas être vide', 'error'); return; }
      try {
        await FOZILA.api('PUT', '/auth/me', { name, password: pwd || undefined });
        user.name = name;
        localStorage.setItem('fozila_user', JSON.stringify(user));
        FOZILA.toast('Profil mis à jour', 'success');
        document.getElementById('dash-name').textContent = name;
      } catch(err) {
        FOZILA.toast(err.message || 'Erreur mise à jour', 'error');
      }
    }

    async function openPlayer(token, type, btn) {
      const container = document.getElementById('tracks-' + token);
      if (container.style.display === 'block') {
        container.style.display = 'none';
        btn.textContent = '▶ Écouter';
        return;
      }
      btn.textContent = '⏳ Chargement...';
      try {
        if (type === 'album') {
          const tracks = await FOZILA.api('GET', `/download/${token}/tracks`);
          if (!tracks.length) { FOZILA.toast('Aucun titre disponible', 'info'); btn.textContent = '▶ Écouter'; return; }
          container.innerHTML = `
            <div class="mini-player">
              <audio id="audio-${token}" controls style="width:100%;height:32px;">
                <source src="/api/download/${token}/track/${tracks[0].id}?dl=0" type="audio/mpeg">
              </audio>
            </div>
            <div style="margin-top:6px;">
              ${tracks.map(t => `
                <div class="track-item" onclick="playTrack('${token}', ${t.id})">
                  <span class="track-num">${String(t.track_num).padStart(2,'0')}</span>
                  <span class="track-title">${t.title}</span>
                  <span class="track-play">▶</span>
                </div>`).join('')}
            </div>`;
        } else {
          container.innerHTML = `
            <div class="mini-player">
              <audio id="audio-${token}" controls style="width:100%;height:32px;">
                <source src="/api/download/${token}?dl=0" type="audio/mpeg">
              </audio>
            </div>`;
        }
        container.style.display = 'block';
        btn.textContent = '⏸ Fermer';
      } catch(e) {
        FOZILA.toast('Erreur chargement audio', 'error');
        btn.textContent = '▶ Écouter';
      }
    }

    function playTrack(token, trackId) {
      const audio = document.getElementById('audio-' + token);
      if (!audio) return;
      audio.src = `/api/download/${token}/track/${trackId}?dl=0`;
      audio.play();
    }

    async function cacheAndRedirect(token, type, itemId) {
      const btn = event.target;
      btn.textContent = '⏳ Téléchargement...';
      btn.disabled = true;
      try {
        if (type === 'album') {
          const tracks = await FOZILA.api('GET', `/download/${token}/tracks`);
          // Mettre chaque piste en cache
          for (const t of tracks) {
            await fetch(`/api/download/${token}/track/${t.id}?dl=0`);
          }
        } else {
          await fetch(`/api/download/${token}?dl=0`);
        }
        // Marquer comme mis en cache
        localStorage.setItem('cached_' + token, '1');
        FOZILA.toast('✅ Musique disponible hors ligne !', 'success');
        // Rediriger vers Ma bibliothèque
        setTimeout(() => {
          switchTab('library');
          location.reload();
        }, 1200);
      } catch(e) {
        FOZILA.toast('Erreur lors du téléchargement', 'error');
        btn.textContent = '📥 Télécharger';
        btn.disabled = false;
      }
    }

    loadDashboard().catch(console.error);
  </script>
</body>
</html>
