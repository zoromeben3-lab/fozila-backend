<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Fôliza — Votre musique, en ligne</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="fozila.css"/>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#7C3AED"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Fôliza"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <style>
    body { padding-top: 96px; }
    .albums-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px; }
    .singles-row  { display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px; }
    footer { position:relative;z-index:1;border-top:1px solid var(--border);padding:32px 6%;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px;flex-wrap:wrap;gap:12px; }
    .glow-hero { position:fixed;width:700px;height:700px;top:-200px;right:-200px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,0.12),transparent 70%);pointer-events:none;z-index:0; }
    @media(max-width:768px){ .albums-grid{grid-template-columns:repeat(2,1fr);} .singles-row{grid-template-columns:repeat(2,1fr);} }
  </style>
</head>
<body>
  <!-- SPLASH SCREEN -->
<div id="splash-screen" style="position:fixed;inset:0;z-index:99999;background:#080808;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.5s ease;">
  <svg width="120" height="120" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg" style="margin-bottom:24px;">
    <rect width="680" height="680" fill="#080808" rx="80"/>
    <path d="M 200 340 A 140 160 0 0 1 480 340" fill="none" stroke="#7C3AED" stroke-width="10" stroke-linecap="round"/>
    <circle cx="185" cy="355" r="55" fill="none" stroke="#7C3AED" stroke-width="9"/>
    <circle cx="185" cy="355" r="30" fill="none" stroke="#7C3AED" stroke-width="3"/>
    <line x1="172" y1="348" x2="172" y2="362" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
    <line x1="185" y1="342" x2="185" y2="368" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
    <line x1="198" y1="348" x2="198" y2="362" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
    <circle cx="495" cy="355" r="55" fill="none" stroke="#7C3AED" stroke-width="9"/>
    <circle cx="495" cy="355" r="30" fill="none" stroke="#7C3AED" stroke-width="3"/>
    <line x1="482" y1="348" x2="482" y2="362" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
    <line x1="495" y1="342" x2="495" y2="368" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
    <line x1="508" y1="348" x2="508" y2="362" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
  </svg>
  <div style="font-family:'Syne',sans-serif;font-size:32px;font-weight:800;color:#f0f0f0;letter-spacing:-1px;">Fôli<span style="color:#A78BFA;">za</span></div>
  <div style="font-size:13px;color:#666;margin-top:8px;">Votre musique en ligne</div>
</div>
<script>
  window.addEventListener('load', () => {
    setTimeout(() => {
      const s = document.getElementById('splash-screen');
      if (s) { s.style.opacity='0'; setTimeout(()=>s.remove(),500); }
    }, 1500);
  });
</script>

<div class="glow-hero"></div>
  <div id="announce-bar"></div>
  <nav id="main-nav"></nav>

  <!-- ALBUMS -->
  <div class="section-wrap">
    <div class="section-label">Catalogue</div>
    <h2 class="section-title">Albums</h2>
    <div class="albums-grid" id="albums-grid"></div>
    <div style="text-align:center;margin-top:32px;">
      <a href="albums.html" class="btn-outline">Voir tous les albums →</a>
    </div>
  </div>

  <!-- SINGLES -->
  <div class="section-wrap" style="padding-top:0;">
    <div class="section-label">Singles</div>
    <h2 class="section-title">Singles</h2>
    <div class="singles-row" id="singles-grid"></div>
    <div style="text-align:center;margin-top:32px;">
      <a href="singles.html" class="btn-outline">Voir tous les singles →</a>
    </div>
  </div>

  <footer>
    <a href="index.html" class="logo" style="font-size:16px;">Fôli<em>za</em></a>
    <span>© 2025 Fôliza · Tous droits réservés</span>
    <div style="display:flex;gap:16px;">
      <a href="albums.html"  style="color:var(--muted);text-decoration:none;font-size:12px;">Albums</a>
      <a href="singles.html" style="color:var(--muted);text-decoration:none;font-size:12px;">Singles</a>
      <a href="auth.html"    style="color:var(--muted);text-decoration:none;font-size:12px;">Admin ↗</a>
    </div>
  </footer>

  <script src="fozila.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(() => console.log('✅ SW enregistré'))
        .catch(e => console.log('SW erreur:', e));
    }
  </script>
  <script>
    FOZILA.injectNav('home');
    FOZILA.injectAnnounce();

    async function loadPage() {
      const user = FOZILA.getUser();
      const [albums, singles] = await Promise.all([
        FOZILA.getAlbums(),
        FOZILA.getSingles()
      ]);

      // Albums
      const albumsGrid = document.getElementById('albums-grid');
      const ownedAlbums = user
        ? await Promise.all(albums.map(a => FOZILA.hasPurchased(a.id, 'album')))
        : albums.map(() => false);

      albumsGrid.innerHTML = albums.map((a, i) => {
        const owned = ownedAlbums[i];
        return `
          <a href="album-detail.html?id=${a.id}" class="album-card">
            <div class="album-cover" style="background:${a.grad}">
              ${a.cover_path ? `<img src="${a.cover_path}" style="width:100%;height:100%;object-fit:cover;">` : a.emoji}
              ${a.tag ? `<span class="album-tag">${a.tag}</span>` : ''}
              ${a.featured ? '<span class="featured-star">⭐</span>' : ''}
            </div>
            <div class="album-info">
              <div class="album-title">${a.title}</div>
              <div class="album-artist">${a.tracks} titres · ${a.genre}</div>
              <div class="album-footer">
                <span class="album-price" style="${owned?'color:var(--green);':''}">${owned ? '✓ Acheté' : FOZILA.fmt(a.price)}</span>
                <span class="btn-buy">${owned ? '⬇️' : 'Acheter'}</span>
              </div>
            </div>
          </a>`;
      }).join('');

      // Singles
      const singlesGrid = document.getElementById('singles-grid');
      const ownedSingles = user
        ? await Promise.all(singles.map(s => FOZILA.hasPurchased(s.id, 'single')))
        : singles.map(() => false);

      singlesGrid.innerHTML = singles.map((s, i) => {
        const owned = ownedSingles[i];
        return `
          <a href="singles.html?id=${s.id}" class="single-card">
            <div class="single-cover" style="background:${s.grad}">
              ${s.cover_path ? `<img src="${s.cover_path}" style="width:100%;height:100%;object-fit:cover;">` : s.emoji}
              ${s.featured ? '<span class="featured-star">⭐</span>' : ''}
            </div>
            <div class="single-info">
              <div class="single-title">${s.title}</div>
              <div class="single-meta">${s.duration} · ${s.genre}</div>
              <div class="single-footer">
                <span style="font-size:13px;font-weight:700;color:var(--v-light);">${owned ? '✓ Acheté' : FOZILA.fmt(s.price)}</span>
                <span class="btn-buy">${owned ? '⬇️' : 'Acheter'}</span>
              </div>
            </div>
          </a>`;
      }).join('');
    }

    loadPage().catch(console.error);
  </script>
</body>
</html>
