<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Fôliza — Singles</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="fozila.css"/>
  <style>
    .singles-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:18px; }
    @media(max-width:640px){ .singles-grid{grid-template-columns:repeat(2,1fr);} }
    .pay-method{background:var(--card2);border:2px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;text-align:center;transition:all 0.2s;font-size:12px;}
    .pay-method:hover,.pay-method.selected{border-color:var(--v);background:var(--v-dim);}
  </style>
</head>
<body>
  <div id="announce-bar"></div>
  <nav id="main-nav"></nav>

  <div class="section-wrap">
    <div class="section-label">Catalogue</div>
    <h1 class="section-title">Singles & Titres</h1>
    <p class="section-sub">Tous les titres disponibles à l'achat individuel</p>
    <div class="singles-grid" id="singles-grid"></div>
  </div>

  <!-- MODAL ACHAT SINGLE -->
  <div class="modal-overlay hidden" id="buy-single-modal">
    <div class="modal">
      <button class="modal-close" onclick="document.getElementById('buy-single-modal').classList.add('hidden')">✕</button>
      <h3 style="font-family:'Syne',sans-serif;font-size:20px;font-weight:700;margin-bottom:6px;">Acheter ce single</h3>
      <p style="color:var(--muted);font-size:13px;margin-bottom:24px;" id="bsm-name"></p>
      <div style="display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:14px;">
        <div class="pay-method selected" data-m="orange_money" onclick="selectPay(this)"><div style="font-size:22px;margin-bottom:4px;">🟠</div><div style="font-size:12px;">Orange Money</div></div>
      </div>
      <div id="bsm-instructions" style="background:var(--card2);border:1px solid var(--v-border);border-radius:10px;padding:14px;margin-bottom:16px;font-size:13px;line-height:1.6;"></div>
      <div class="form-group"><label>Numéro de dépôt</label><input type="text" id="bsm-num" placeholder="Numéro reçu par SMS après le dépôt"/></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
        <span style="color:var(--muted);font-size:13px;">Total :</span>
        <span style="font-family:'Syne',sans-serif;font-size:22px;font-weight:700;color:var(--v-light);" id="bsm-price"></span>
      </div>
      <button class="btn-primary" style="width:100%;margin-top:18px;padding:13px;" onclick="confirmSinglePayment()">J'ai envoyé le paiement</button>
    </div>
  </div>

  <script src="fozila.js"></script>
  <script>
    FOZILA.injectNav('singles');
    FOZILA.injectAnnounce();

    let currentSingleId = null;
    let allSingles = [];
    const _user = FOZILA.getUser();

    async function renderSingles() {
      allSingles = await FOZILA.getSingles();
      const grid = document.getElementById('singles-grid');

      const statuses = _user
        ? await Promise.all(allSingles.map(s => FOZILA.api('GET', `/purchases/has/single/${s.id}`).catch(() => ({}))))
        : allSingles.map(() => ({}));

      grid.innerHTML = allSingles.map((s, i) => {
        const owned   = !!statuses[i].owned;
        const pending = !!statuses[i].pending;
        return `
        <div class="single-card">
          <div class="single-cover" style="background:${s.grad}">
            ${s.cover_path ? `<img src="${s.cover_path}" style="width:100%;height:100%;object-fit:cover;">` : s.emoji}
            ${s.featured ? '<span class="featured-star">⭐</span>' : ''}
          </div>
          <div class="single-info">
            <div class="single-title">${s.title}</div>
            <div class="single-meta">${s.duration} · ${s.genre}</div>
            <div class="single-footer">
              <span style="font-size:14px;font-weight:700;color:${pending?'#f0a500':'var(--v-light)'};">
                ${owned ? '✓ Acheté' : pending ? '⏳ En attente' : FOZILA.fmt(s.price)}
              </span>
              ${owned
                ? `<button onclick="playSingle(${s.id}, '${statuses[i].download_token}')" class="btn-buy">▶ Écouter</button>`
                : pending
                ? `<button class="btn-buy" disabled style="opacity:0.5;">⏳</button>`
                : `<button onclick="openBuySingle(${s.id})" class="btn-buy">Acheter</button>`
              }
            </div>
          </div>
        </div>`;
      }).join('');
    }

    async function playSingle(id, token) {
      if (!token) {
        const result = await FOZILA.api('GET', `/purchases/has/single/${id}`).catch(() => ({}));
        token = result.download_token;
      }
      if (!token) { FOZILA.toast('Erreur d\'accès', 'error'); return; }
      location.href = `player.html?token=${token}&type=single&id=${id}`;
    }

    function openBuySingle(id) {
      const user = FOZILA.getUser();
      if (!user) { FOZILA.toast('Connectez-vous d\'abord', 'error'); setTimeout(()=>location.href='auth.html',1400); return; }
      currentSingleId = id;
      const s = allSingles.find(x => x.id === id);
      if (!s) return;
      document.getElementById('bsm-name').textContent = s.title;
      document.getElementById('bsm-price').textContent = FOZILA.fmt(s.price);
      showBsmInstructions('orange_money', s.price);
      document.getElementById('buy-single-modal').classList.remove('hidden');
    }

    function showBsmInstructions(method, price) {
      const info = FOZILA.PAYMENT_INFO[method];
      const code = info.ussd.replace('{number}', info.number).replace('{amount}', price);
      const link = FOZILA.ussdLink(method, price);
      document.getElementById('bsm-instructions').innerHTML = `
        Composez ce code sur votre téléphone :<br>
        <div style="background:#000;border:1px solid var(--v-border);border-radius:8px;padding:10px;margin:8px 0;text-align:center;font-family:monospace;font-size:15px;color:var(--v-light);font-weight:700;">${code}</div>
        <a href="${link}" style="display:block;text-align:center;background:var(--v);color:#fff;padding:10px;border-radius:8px;text-decoration:none;font-weight:600;font-size:13px;margin-bottom:8px;">📞 Composer automatiquement</a>
        Puis collez ci-dessous le numéro de dépôt reçu par SMS.`;
    }

    function selectPay(el) {
      document.querySelectorAll('.pay-method').forEach(m => m.classList.remove('selected'));
      el.classList.add('selected');
      const s = allSingles.find(x => x.id === currentSingleId);
      if (s) showBsmInstructions(el.dataset.m, s.price);
    }

    async function confirmSinglePayment() {
      const num    = document.getElementById('bsm-num').value.trim();
      const method = document.querySelector('.pay-method.selected')?.dataset.m || 'orange_money';
      if (!num) { FOZILA.toast('Entrez le numéro de dépôt reçu par SMS', 'error'); return; }
      document.getElementById('buy-single-modal').classList.add('hidden');
      FOZILA.toast('⏳ Envoi de la demande…', 'info');
      try {
        await FOZILA.purchase(currentSingleId, 'single', method, num);
        FOZILA.toast('✅ Demande envoyée ! En attente de validation.', 'success');
        await renderSingles();
      } catch(err) {
        FOZILA.toast(err.message || 'Erreur lors de la demande', 'error');
      }
    }

    renderSingles().then(() => {
      const urlId = parseInt(new URLSearchParams(location.search).get('id'));
      if (urlId && allSingles.find(s => s.id === urlId)) {
        setTimeout(() => openBuySingle(urlId), 500);
      }
    });
  </script>
</body>
</html>
