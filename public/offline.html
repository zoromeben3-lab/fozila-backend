<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Fôliza — Hors ligne</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#080808; color:#f0f0f0; font-family:'DM Sans',sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
    .logo { font-size:32px; font-weight:800; margin-bottom:8px; }
    .logo span { color:#A78BFA; }
    .icon { font-size:60px; margin-bottom:20px; }
    h2 { font-size:20px; margin-bottom:10px; }
    p { color:#666; font-size:14px; text-align:center; max-width:300px; line-height:1.6; margin-bottom:24px; }
    .btn { background:#7C3AED; color:#fff; border:none; padding:12px 28px; border-radius:10px; font-size:15px; cursor:pointer; }
    .btn:hover { background:#6D28D9; }
  </style>
</head>
<body>
  <div class="icon">🎵</div>
  <div class="logo">Fôli<span>za</span></div>
  <h2>Vous êtes hors ligne</h2>
  <p>Reconnectez-vous à internet pour accéder à Fôliza et écouter votre musique.</p>
  <button class="btn" onclick="location.reload()">🔄 Réessayer</button>
</body>
</html>
